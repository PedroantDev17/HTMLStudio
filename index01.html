<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon_io/favicon-16x16.png" type="image/x-icon">
    <title>inicial</title>
</head>
<style>

    @font-face {
    font-family:'Designer' ;
    src: url(fonts/designer_2/Designer.otf) format(opentype);
}

:root{
    --color-red:#D90B0B;
    --color-red-claro:#D92929;
    --color-red-claro2:#D95f5f;
    --color-redclaro3:#d99696;
    --color-white:#f2f2f2;
    --font:'Designer';
}

*{
    font-family: var(--font);
}

body{
    display: grid;
    justify-content: center;
    position: fixed;
    top: 18%;
    background-color:rgb(255, 0, 0);
    }
    h2 {
        margin: 10px ;
    }
    .container{
        display: grid;
        grid-auto-flow: column;
        align-items: center;

    }
    
    img{
        width: 115vh;
        box-shadow: 2px 2.5px 3px black;
        margin: 25px;
        border-radius: 10px;
        opacity: 0.94;
    
    }
    .pagina{
           padding: 15px;
            border-radius: 5px;
            box-shadow: 2px 2.5px 3px black;
            width: 50vh;
            height: 50vh;
            text-align: center;
            display: grid;
            grid-auto-flow: row;
            justify-content: center;
            align-content: center;
            font-size: 30px;
            margin: 10px;
            background-color: #D90B0B;
}
    input{
        margin:10px 15px;
        border-radius: 5px;
        padding: 10px;
    }
</style>
<body>
    <div class="container">
            <img src="imagens/HTML Studio.png" alt="HTMLStudio">
        <div class="pagina">
            <h2>vendedor</h2>
            <input type="email" name="email" id="email" placeholder="Digite seu Email">
            <h2>Usuario</h2>
            <input type="email" name="email_user" id="email_user" placeholder="Digite seu Email">
        </div>
    </div>
</body>
</html>
